
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de produits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Notre collection</h1>
        <button id="theme-toggle">🌙 Mode sombre</button>
    </header>

    <main>
        <section class="products">

            <article class="card">
                <img src="casque.jpeg" alt="Casque audio">
                <h2>Casque audio</h2>
                <p>Un son exceptionnel pour votre quotidien.</p>
                <span>45 000 FCFA</span>
            </article>

            <article class="card">
                <img src="montre.jpeg" alt="Montre">
                <h2>Montre élégante</h2>
                <p>Un style moderne et raffiné.</p>
                <span>35 000 FCFA</span>
            </article>

            <article class="card">
                <img src="chaussure.jpeg" alt="Chaussure">
                <h2>Sneakers</h2>
                <p>Le confort et le style réunis.</p>
                <span>50 000 FCFA</span>
            </article>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
